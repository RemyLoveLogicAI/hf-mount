services:
  hf-mount-fuse:
    image: hf-mount:latest
    build: .
    container_name: hf-mount-fuse
    restart: unless-stopped
    volumes:
      - fuse-model-data:/mnt/models
      - fuse-hf-mount-cache:/cache
      - ./hf-token:/run/secrets/hf-token:ro
    devices:
      - /dev/fuse
    entrypoint: ["sh", "-c"]
    command: >
      repo openai/gpt-oss-20b /mnt/models
      --token-file /run/secrets/hf-token
      --cache-dir /cache
      --cache-size ${CACHE_SIZE}
      --metadata-ttl-ms ${METADATA_TTL_MS}
      --poll-interval-secs ${POLL_INTERVAL_SECS}
      --poll-listing-concurrency ${POLL_LISTING_CONCURRENCY}
      --cache-mode ${CACHE_MODE}
      ${READ_ONLY:+--read-only}
      ${ADVANCED_WRITES:+--advanced-writes}
      ${NO_DISK_CACHE:+--no-disk-cache}
      ${DIRECT_IO:+--direct-io}
      --max-threads ${MAX_THREADS}
      --flush-debounce-ms ${FLUSH_DEBOUNCE_MS}
      --flush-max-batch-window-ms ${FLUSH_MAX_BATCH_WINDOW_MS}
      --flush-shutdown-timeout-ms ${FLUSH_SHUTDOWN_TIMEOUT_MS}
      --read-fetch-timeout-ms ${READ_FETCH_TIMEOUT_MS}
      --inode-soft-limit ${INODE_SOFT_LIMIT}
      --lru-sweep-interval-ms ${LRU_SWEEP_INTERVAL_MS}
      ${NO_FILTER_OS_FILES:+--no-filter-os-files}
    healthcheck:
      test: ["CMD-SHELL", "test -d /mnt/models && mountpoint -q /mnt/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
        reservations:
          cpus: "1"
          memory: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges

  hf-mount-overlay:
    image: hf-mount:latest
    build: .
    container_name: hf-mount-overlay
    restart: unless-stopped
    volumes:
      - overlay-model-data:/mnt/models
      - overlay-hf-mount-cache:/cache
      - ./hf-token:/run/secrets/hf-token:ro
    devices:
      - /dev/fuse
    entrypoint: ["sh", "-c"]
    command: >
      repo openai/gpt-oss-20b /mnt/models
      --token-file /run/secrets/hf-token
      --cache-dir /cache
      --cache-size ${CACHE_SIZE}
      --metadata-ttl-ms ${METADATA_TTL_MS}
      --poll-interval-secs ${POLL_INTERVAL_SECS}
      --poll-listing-concurrency ${POLL_LISTING_CONCURRENCY}
      --cache-mode ${CACHE_MODE}
      ${READ_ONLY:+--read-only}
      --overlay
      ${ADVANCED_WRITES:+--advanced-writes}
      ${NO_DISK_CACHE:+--no-disk-cache}
      ${DIRECT_IO:+--direct-io}
      --max-threads ${MAX_THREADS}
      --flush-debounce-ms ${FLUSH_DEBOUNCE_MS}
      --flush-max-batch-window-ms ${FLUSH_MAX_BATCH_WINDOW_MS}
      --flush-shutdown-timeout-ms ${FLUSH_SHUTDOWN_TIMEOUT_MS}
      --read-fetch-timeout-ms ${READ_FETCH_TIMEOUT_MS}
      --inode-soft-limit ${INODE_SOFT_LIMIT}
      --lru-sweep-interval-ms ${LRU_SWEEP_INTERVAL_MS}
      ${NO_FILTER_OS_FILES:+--no-filter-os-files}
    healthcheck:
      test: ["CMD-SHELL", "test -d /mnt/models && mountpoint -q /mnt/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
        reservations:
          cpus: "1"
          memory: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges

volumes:
  fuse-model-data:
    driver: local
  fuse-hf-mount-cache:
    driver: local
  overlay-model-data:
    driver: local
  overlay-hf-mount-cache:
    driver: local
