services:
  hf-mount-nfs:
    image: hf-mount:latest
    build: .
    container_name: hf-mount-nfs
    restart: unless-stopped
    ports:
      - "2049:2049"
    volumes:
      - model-data:/mnt/models
      - hf-mount-cache:/cache
      - ./hf-token:/run/secrets/hf-token:ro
    environment:
      HF_TOKEN_FILE: /run/secrets/hf-token
      CACHE_SIZE: "20000000000"
      METADATA_TTL_MS: "10000"
      POLL_INTERVAL_SECS: "30"
      POLL_LISTING_CONCURRENCY: "4"
      CACHE_MODE: "chunk"
      READ_ONLY: "true"
      ADVANCED_WRITES: "false"
      NO_DISK_CACHE: "false"
      DIRECT_IO: "false"
      FLUSH_DEBOUNCE_MS: "2000"
      FLUSH_MAX_BATCH_WINDOW_MS: "30000"
      FLUSH_SHUTDOWN_TIMEOUT_MS: "45000"
      READ_FETCH_TIMEOUT_MS: "30000"
      INODE_SOFT_LIMIT: "0"
      LRU_SWEEP_INTERVAL_MS: "5000"
      NO_FILTER_OS_FILES: "false"
      RUST_LOG: "hf_mount=info"
    command: >
      repo openai/gpt-oss-20b /mnt/models
      --token-file /run/secrets/hf-token
      --cache-dir /cache
      --cache-size ${CACHE_SIZE}
      --metadata-ttl-ms ${METADATA_TTL_MS}
      --poll-interval-secs ${POLL_INTERVAL_SECS}
      --poll-listing-concurrency ${POLL_LISTING_CONCURRENCY}
      --cache-mode ${CACHE_MODE}
      --read-only ${READ_ONLY}
      --advanced-writes ${ADVANCED_WRITES}
      --no-disk-cache ${NO_DISK_CACHE}
      --direct-io ${DIRECT_IO}
      --flush-debounce-ms ${FLUSH_DEBOUNCE_MS}
      --flush-max-batch-window-ms ${FLUSH_MAX_BATCH_WINDOW_MS}
      --flush-shutdown-timeout-ms ${FLUSH_SHUTDOWN_TIMEOUT_MS}
      --read-fetch-timeout-ms ${READ_FETCH_TIMEOUT_MS}
      --inode-soft-limit ${INODE_SOFT_LIMIT}
      --lru-sweep-interval-ms ${LRU_SWEEP_INTERVAL_MS}
      --no-filter-os-files ${NO_FILTER_OS_FILES}
    healthcheck:
      test: ["CMD-SHELL", "test -d /mnt/models && mountpoint -q /mnt/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
        reservations:
          cpus: "1"
          memory: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL

  hf-mount-fuse:
    image: hf-mount:latest
    build: .
    container_name: hf-mount-fuse
    restart: unless-stopped
    volumes:
      - model-data:/mnt/models
      - hf-mount-cache:/cache
      - ./hf-token:/run/secrets/hf-token:ro
    environment:
      HF_TOKEN_FILE: /run/secrets/hf-token
      CACHE_SIZE: "20000000000"
      METADATA_TTL_MS: "10000"
      POLL_INTERVAL_SECS: "30"
      POLL_LISTING_CONCURRENCY: "4"
      CACHE_MODE: "chunk"
      READ_ONLY: "true"
      ADVANCED_WRITES: "false"
      NO_DISK_CACHE: "false"
      DIRECT_IO: "false"
      MAX_THREADS: "16"
      FLUSH_DEBOUNCE_MS: "2000"
      FLUSH_MAX_BATCH_WINDOW_MS: "30000"
      FLUSH_SHUTDOWN_TIMEOUT_MS: "45000"
      READ_FETCH_TIMEOUT_MS: "30000"
      INODE_SOFT_LIMIT: "0"
      LRU_SWEEP_INTERVAL_MS: "5000"
      NO_FILTER_OS_FILES: "false"
      RUST_LOG: "hf_mount=info"
    command: >
      repo openai/gpt-oss-20b /mnt/models
      --fuse
      --token-file /run/secrets/hf-token
      --cache-dir /cache
      --cache-size ${CACHE_SIZE}
      --metadata-ttl-ms ${METADATA_TTL_MS}
      --poll-interval-secs ${POLL_INTERVAL_SECS}
      --poll-listing-concurrency ${POLL_LISTING_CONCURRENCY}
      --cache-mode ${CACHE_MODE}
      --read-only ${READ_ONLY}
      --advanced-writes ${ADVANCED_WRITES}
      --no-disk-cache ${NO_DISK_CACHE}
      --direct-io ${DIRECT_IO}
      --max-threads ${MAX_THREADS}
      --flush-debounce-ms ${FLUSH_DEBOUNCE_MS}
      --flush-max-batch-window-ms ${FLUSH_MAX_BATCH_WINDOW_MS}
      --flush-shutdown-timeout-ms ${FLUSH_SHUTDOWN_TIMEOUT_MS}
      --read-fetch-timeout-ms ${READ_FETCH_TIMEOUT_MS}
      --inode-soft-limit ${INODE_SOFT_LIMIT}
      --lru-sweep-interval-ms ${LRU_SWEEP_INTERVAL_MS}
      --no-filter-os-files ${NO_FILTER_OS_FILES}
    healthcheck:
      test: ["CMD-SHELL", "test -d /mnt/models && mountpoint -q /mnt/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
        reservations:
          cpus: "1"
          memory: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges

volumes:
  model-data:
    driver: local
  hf-mount-cache:
    driver: local
